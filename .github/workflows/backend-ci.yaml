name: Backend CI

on:
  push:
    branches:
      - dev
    paths:
      - "packages/backend/**"
  pull_request:
    paths:
      - "packages/backend/**"

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-lint-and-format:
    name: Check lint and format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: ./packages/backend
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma types
        working-directory: ./packages/backend
        run: pnpm prisma:generate

      - name: Run lint
        working-directory: ./packages/backend
        run: pnpm run lint

      - name: Run format check
        working-directory: ./packages/backend
        run: pnpm run format

      - name: Checking the build process
        working-directory: ./packages/backend
        run: pnpm build

  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs:
      - check-lint-and-format

    environment: Backend CI

    permissions:
      contents: read
      packages: write
      id-token: write

    # if: github.event_name == 'push'

    env:
      REGISTRY_HOST: ghcr.io
      REGISTRY_USERNAME: ${{ github.actor }}
      REGISTRY_PASSWORD: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to private Docker image registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_HOST }}/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest
            type=sha,format=short
# ,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Build and push image (backend)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./packages/backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
