services:
  postgres:
    image: postgres:16.8-alpine3.20
    container_name: ugram-postgres
    shm_size: 128mb
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ugram-database:/var/lib/postgresql/data:rw
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - ugram-network

  backend:
    depends_on:
      - postgres
    image: ugram-backend
    build:
      context: .
      dockerfile: ./packages/backend/Dockerfile
    container_name: ugram-backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    networks:
      - ugram-network
    restart: unless-stopped

  frontend:
    depends_on:
      - backend
    image: ugram-frontend
    build:
      context: .
      dockerfile: ./packages/frontend/Dockerfile
    container_name: ugram-frontend
    ports:
      - "80:80"
    env_file:
      - .env
    networks:
      - ugram-network
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: ugram-minio
    ports:
      - "9000:9000" # web panel
      - "9001:9001"
    networks:
      - ugram-network
    volumes:
      - ugram-s3:/data:rw
    env_file:
      - .env
    command: server /data --console-address ":9001"
    restart: unless-stopped

networks:
  ugram-network:

volumes:
  ugram-database:
  ugram-s3:
