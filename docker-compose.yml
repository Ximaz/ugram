services:
  postgres:
    image: postgres:16.8-alpine3.20
    container_name: ugram-postgres
    shm_size: 128mb
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ugram-database:/var/lib/postgresql/data:rw
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - ugram-network

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: ugram-minio
    ports:
      - "9000:9000" # web panel
      - "9001:9001"
    networks:
      - ugram-network
    volumes:
      - ugram-s3:/data:rw
    env_file:
      - .env
    command: server /data --console-address ":9001"
    restart: unless-stopped

  redis:
    image: redis:alpine3.20
    restart: unless-stopped
    container_name: ugram-redis
    ports:
      - "6379:6379"
    env_file:
      - .env
    volumes:
      - ugram-cache:/data:rw
    networks:
      - ugram-network
    command: redis-server --save 60 1 --loglevel warning

  backend:
    depends_on:
      - postgres
      - minio
      - redis
    image: ugram-backend
    build:
      context: .
      dockerfile: ./packages/backend/Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    container_name: ugram-backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    networks:
      - ugram-network
    restart: unless-stopped

  frontend:
    depends_on:
      - backend
    image: ugram-frontend
    build:
      context: .
      dockerfile: ./packages/frontend/Dockerfile
      args:
        - API_URL=http://backend:3000
    container_name: ugram-frontend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - ORIGIN=${FRONTEND_ORIGIN}
      - BODY_SIZE_LIMIT=50M
    networks:
      - ugram-network
    restart: unless-stopped

networks:
  ugram-network:

volumes:
  ugram-database:
  ugram-s3:
